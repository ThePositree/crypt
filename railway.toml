[build]
builder = "RAILPACK"
# Install only production + optional extras; skip dev toolchain.
buildCommand = "uv sync --all-extras --no-dev"

[deploy]
# uv includes the `dev` dependency group by default on `uv run` — skip it so
# the container does not reinstall mypy/ruff on every cold start.
startCommand = "uv run --no-dev python -u -m crypt"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
