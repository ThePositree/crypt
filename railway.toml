$schema = "https://railway.com/railway.schema.json"

[build]
builder = "RAILPACK"
# Install only production + optional extras; skip dev toolchain.
buildCommand = "uv sync --all-extras --no-dev"

[deploy]
startCommand = "uv run python -m crypt"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
