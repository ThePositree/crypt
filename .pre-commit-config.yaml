repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(src/backtester|tests/backtester)/
      - id: ruff-format
        exclude: ^(src/backtester|tests/backtester)/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --strict src/crypt
        language: system
        types: [python]
        pass_filenames: false
