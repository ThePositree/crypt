version: 1
updated: 2026-08-11
purpose: >
  Deterministic first-pass routing for AI agents. Read AGENTS.md and
  docs/state/current.yml first, then pick routes by task instead of loading all
  markdown files.

always:
  - path: AGENTS.md
    mode: full
    reason: hard rules and bootstrap
  - path: docs/agent/context_routes.yml
    mode: full
    reason: deterministic route selector
  - path: docs/state/current.yml
    mode: full
    reason: compact current state

routes:
  live_execution:
    match:
      - live
      - railway
      - okx
      - execution
      - telegram
      - position
      - exchange
    full_docs:
      - docs/execution/live_execution.md
      - docs/deploy/railway.md
      - docs/execution/live_backtest_reconciliation_2026-07-28.md
      - docs/execution/telegram_notifications.md
    notes:
      - Runtime env/config beats prose.
      - OKX is the truth for money, fills, fees, and positions.

  backtester_regression:
    match:
      - backtester
      - regression
      - phase-a
      - phase-b
      - phase-c
      - replay
      - parity
    full_docs:
      - docs/backtester_regression.md
      - docs/execution/live_backtest_reconciliation_2026-07-28.md
    notes:
      - Use phase checkpoints from docs/backtester_regression.md only.
      - Phase C uses separate warmup/accounting via --load-from and --from.

  strategy_research:
    match:
      - strategy
      - benchmark
      - optimize
      - donor
      - portfolio
      - dss
      - candidate
      - router
    full_docs:
      - docs/strategy_benchmark.md
      - docs/backtester/candidate_archive.md
      - docs/archive/candidates/README.md
      - docs/discovery/direct_signal_search_v3.md
      - docs/strategies/incremental_router_runtime.md
    notes:
      - Benchmark is a reporting target, not a production veto.
      - Owner-promoted live config remains operational truth.

  docs_ai_context:
    match:
      - agents
      - context
      - docs
      - markdown
      - changelog
      - archive
      - vector
      - image-pack
      - source
    full_docs:
      - docs/agent/ai_context_system.md
      - docs/agent/context_benchmark.md
      - docs/agent/context_benchmark_results.md
      - docs/agent/operating_rules.md
      - CHANGELOG.md
      - CHANGELOG_ARCHIVE.md
    notes:
      - Hard rules stay as text, not embeddings or images.
      - Vector/image retrieval can assist discovery, but cannot be source truth.

  frontend_design:
    match:
      - frontend
      - ui
      - ux
      - design
      - screen
      - component
      - visual
      - responsive
      - browser
      - screenshot
      - component docs
    full_docs:
      - docs/agent/frontend_design_subsystem.md
      - docs/frontend/context.md
      - docs/frontend/messaging.md
      - docs/frontend/design-identity.md
      - docs/frontend/design-system.md
      - docs/frontend/component-registry.md
      - docs/frontend/visual-references/interpretation.md
      - docs/frontend/wireframes/
      - docs/frontend/flows/
      - docs/frontend/screens/
      - docs/frontend/decisions/
      - docs/frontend/reviews/
    notes:
      - Start with an outcome/scope/source/constraint/evidence/unknowns Task Contract.
      - Frontend depth D0-D3 determines proportional artifacts and approvals.
      - Important frontend text needs Messaging Identity, Messaging Contract, proof,
        objection handling, and Copy QA proportional to scope.
      - Rendered visual inspection is required for meaningful UI changes.
      - Wireframes are directly openable HTML artifacts; screenshots are evidence only.
      - Frontend Markdown contracts require independent potential-lead review.
      - Independent reviewers use separate contexts with role-minimal briefs;
        first-use reviewers must not read repository or authoring context.
      - D2/D3 wireframes default to W1 demonstration fidelity; functional W3
        prototypes require explicit owner approval.
      - Substantial D2/D3 copy uses source-grounded content authoring and an
        independent rendered-copy review.
      - Design/control, production implementation, and final QA use separate contexts.
      - Production must satisfy the approved Wireframe Conformance Contract.
      - Persistent frontend memory lives under docs/frontend/.

  architecture_or_adr:
    match:
      - adr
      - architecture
      - component
      - engine
      - sink
      - sandbox
    full_docs:
      - docs/agent/operating_rules.md
      - docs/architecture.md
      - docs/architecture/flexible_sandbox.md
      - docs/decisions/
    notes:
      - Read only ADRs relevant to the current decision.
      - New reversible-risk trade-offs need a new ADR.

  agent_operations:
    match:
      - task
      - backlog
      - in_progress
      - command
      - uv
      - cache
      - eta
      - missing
      - candle
    full_docs:
      - docs/agent/operating_rules.md
    notes:
      - Use detailed operating rules for task hygiene and command policy.

fallback:
  full_docs:
    - docs/agent/operating_rules.md
  search:
    - rg --files docs
    - rg "<task keywords>" docs src tests strategies
