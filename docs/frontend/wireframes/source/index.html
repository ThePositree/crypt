<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>crypt docs wireframe</title>
    <link rel="stylesheet" href="wireframe.css" />
  </head>
  <body>
    <a class="skip" href="#content">К содержанию</a>
    <header>
      <a class="brand" href="?screen=home">crypt</a>
      <button class="nav-toggle" aria-label="Открыть навигацию">☰</button>
      <button class="search">⌕ Поиск по документации <kbd>⌘K</kbd></button>
      <span class="viewport" id="viewport"></span>
    </header>
    <div class="shell">
      <nav aria-label="Разделы документации">
        <strong>ДОКУМЕНТАЦИЯ</strong>
        <div id="navigation"></div>
      </nav>
      <main id="content">
        <div class="crumb" id="crumb"></div>
        <h1 id="title"></h1>
        <p class="lead" id="lead"></p>
        <div class="character" id="character"></div>
        <section class="blocks" id="blocks"></section>
        <div class="pager"><button>← Предыдущая</button><button>Следующая →</button></div>
      </main>
      <aside>
        <strong>НА ЭТОЙ СТРАНИЦЕ</strong>
        <div id="toc"></div>
      </aside>
    </div>
    <div class="mobile-actions"><button>Разделы</button><button>Содержание</button></div>
    <script src="wireframe.js"></script>
  </body>
</html>
