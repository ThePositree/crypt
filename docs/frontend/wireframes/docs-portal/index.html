<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

    :root {

      --blue: #d8ecff;
      --green: #d7f1c8;
      --shadow: 0 10px 24px rgba(38, 35, 27, .08);
    }

      --ink: #f4efe2;
      --muted: #bdc4cb;
      --line: #34404a;
      --panel: #202830;
      --sea: #23483f;
      --coral: #563227;
      --lemon: #564a24;
      --blue: #233d55;
      --green: #2d4a31;

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    a:focus-visible, button:focus-visible, input:focus-visible {

      outline-offset: 2px;
    }
    .app { min-height: 100vh; display: grid; grid-template-columns: 280px 1fr 240px; }
    .side, .toc, .top, .drawer, .palette, .panel, .card, .map, .code, .notice {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .side { position: sticky; top: 0; height: 100vh; padding: 18px; border-radius: 0; box-shadow: none; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; margin-bottom: 18px; }
    .marker { width: 26px; height: 30px; border-radius: 7px 7px 12px 7px; background: var(--sea); border: 1px solid var(--line); position: relative; transform: rotate(-8deg); }
    .marker:before, .marker:after { content: ""; position: absolute; top: 10px; width: 4px; height: 4px; border-radius: 50%; background: var(--ink); }
    .marker:before { left: 8px; } .marker:after { right: 8px; }
    .nav-group-title { font-size: 11px; color: var(--muted); text-transform: uppercase; margin: 18px 0 8px; }
    .nav a, .drawer a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--muted); }
    .nav a.active, .nav a:hover, .drawer a.active { background: var(--sea); color: var(--ink); }
    .main { min-width: 0; padding: 18px 24px 64px; }
    .top { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center; padding: 10px; margin-bottom: 18px; }
    .hamburger { display: none; }
    .search { flex: 1; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--muted); background: transparent; }
    .search input { width: 100%; border: 0; background: transparent; color: var(--ink); outline: 0; }
    .kbd { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
    .icon-button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
    .crumbs { color: var(--muted); font-size: 13px; margin: 8px 0 24px; display: flex; gap: 8px; flex-wrap: wrap; }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: stretch; }
    h1 { font-size: clamp(34px, 6vw, 72px); line-height: 1; margin: 0 0 14px; letter-spacing: 0; }
    .page h1 { font-size: 46px; }
    h2 { margin: 34px 0 12px; font-size: 24px; }
    h3 { margin: 0 0 8px; font-size: 17px; }
    p { color: var(--muted); line-height: 1.65; max-width: 760px; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 13px; background: var(--blue); }
    .badge.stable { background: var(--green); } .badge.live { background: var(--coral); } .badge.config { background: var(--lemon); }
    .atlas { min-height: 340px; position: relative; overflow: hidden; padding: 24px; }
    .islands { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 16px; margin-top: 18px; }
    .island { min-height: 92px; border: 1px dashed var(--line); border-radius: 18px 18px 24px 18px; padding: 16px; background: var(--sea); display: flex; flex-direction: column; justify-content: space-between; }
    .island:nth-child(2n) { background: var(--lemon); } .island:nth-child(3n) { background: var(--blue); } .island:nth-child(4n) { background: var(--coral); }
    .routes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 20px; }
    .card { padding: 18px; min-width: 0; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .flow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .step { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--blue); min-width: 120px; text-align: center; }
    .arrow { color: var(--muted); }
    .tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 18px 0; }
    .tabs button { flex: 1; border: 0; padding: 11px; background: transparent; color: var(--muted); cursor: pointer; }
    .tabs button.active { background: var(--sea); color: var(--ink); }
    .accordion { display: grid; gap: 8px; }
    .acc { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
    .acc button { width: 100%; border: 0; background: transparent; color: var(--ink); padding: 14px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; }
    .acc .body { display: none; padding: 0 14px 14px; color: var(--muted); }
    .acc.open .body { display: block; }
    .code { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--ink); color: var(--paper); overflow: auto; }
    .code code { flex: 1; white-space: nowrap; }
    .code button { border: 1px solid rgba(255,255,255,.25); background: transparent; color: inherit; border-radius: 8px; padding: 8px; cursor: pointer; }
    .toc { position: sticky; top: 18px; height: calc(100vh - 36px); padding: 18px; border-radius: 0; box-shadow: none; }
    .toc a { display: block; color: var(--muted); padding: 7px 0; font-size: 13px; border-left: 2px solid transparent; padding-left: 8px; }
    .toc a:hover { color: var(--ink); border-left-color: var(--sea); }
    .next { margin-top: 34px; }
    .notice { padding: 14px; margin: 16px 0; background: var(--lemon); box-shadow: none; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .filters button { border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); padding: 7px 10px; cursor: pointer; }
    .filters button.active { background: var(--sea); }
    .palette-backdrop, .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 20; display: none; }
    .palette-backdrop.open, .drawer-backdrop.open { display: block; }
    .palette { width: min(720px, calc(100vw - 32px)); margin: 80px auto 0; padding: 12px; }
    .result { display: block; padding: 12px; border-radius: 8px; border: 1px solid transparent; }
    .result:hover, .result.active { border-color: var(--line); background: var(--sea); }
    .empty { text-align: center; padding: 36px 16px; }
    .drawer { width: min(320px, 90vw); min-height: 100vh; padding: 18px; border-radius: 0; }
    .mobile-only { display: none; }
    @media (max-width: 1023px) {
      .app { grid-template-columns: 240px 1fr; }
      .toc { display: none; }
      .hero { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 767px) {
      .app { display: block; }
      .side { display: none; }
      .main { padding: 12px; }
      .hamburger, .mobile-only { display: inline-flex; }
      .top { position: static; }
      .kbd { display: none; }
      .page h1, h1 { font-size: 34px; }
      .routes, .two, .grid, .islands { grid-template-columns: 1fr; }
      .island { min-height: auto; }
    }
  </style>
</head>
<body>

      architecture: ["Архитектурная граница", "pure decision code -> backtester replay + live execution adapter"],
      "data-pipeline": ["Backfill", "PYTHONPATH=src uv run python -m crypt.backfill --symbol SOL-USDT-SWAP --from 2022-01-01 --to 2026-08-04 --data-types ohlcv --data-dir data"],
      strategies: ["Strategy config", "EXECUTION_STRATEGY_CONFIG=strategies/archive/<owner-selected-strategy>.json"],
      backtester: ["Backtester", "PYTHONPATH=src uv run backtester run --strategy strategies/archive/<strategy>.json --output results/<run-name>"],
      configuration: ["Runtime env", "EXECUTION_STRATEGY_CONFIG=strategies/archive/<owner-selected-strategy>.json"],
      "live-execution": ["Execution-only dry run", "PYTHONPATH=src EXECUTION_ENABLED=true EXECUTION_DRY_RUN=true uv run python -m crypt --once --execution-only"],
      cli: ["CLI", "PYTHONPATH=src uv run backtester run --strategy strategies/archive/<strategy>.json --output results/<run-name>"],
      operations: ["Railway start command", "uv run --no-dev python -u -m crypt --execution-only"],
      glossary: ["Поисковый алиас", "no look-ahead bias = отсутствие заглядывания в будущие свечи"]
    };
    function commonPage(d) {
      const [snippetLabel, snippet] = snippets[page] || snippets.overview;
      return `<article class="page"><div class="crumbs"><a href="?page=home">Главная</a><span>›</span><span>${d.title}</span></div><h1>${d.title}</h1><p>${d.lead}</p>${badges(d.badges)}<div class="notice"><strong>Источник:</strong> ${d.source}. Эта страница не показывает runtime results.</div><div class="tabs" role="tablist"><button class="active" data-tab="concept">concept</button><button data-tab="flow">flow</button><button data-tab="config">config</button></div><section id="tab-panel" class="panel card">${d.panels.concept}</section>${flow()}<section id="details"><h2>${d.sections[0]}</h2><div class="accordion">${d.sections.map((s,i)=>`<div class="acc ${i===0?'open':''}"><button aria-expanded="${i===0?'true':'false'}">${s}<span>⌄</span></button><div class="body">${[d.panels.concept,d.panels.flow,d.panels.config][i] || d.panels.concept}</div></div>`).join("")}</div></section><section id="command"><h2>${snippetLabel}</h2><div class="code"><code>${snippet}</code><button class="copy" data-copy="${snippet.replace(/"/g,'&quot;')}">Скопировать</button></div><p>Snippets показываются без вывода результатов, live state, балансов, позиций или PnL.</p></section><section class="next" id="next"><h2>Дальше читать</h2><div class="grid">${pages.filter(([s])=>s!==page).slice(0,3).map(([s,l])=>`<a class="card" href="?page=${s}"><h3>${l}</h3><p>Связанный раздел framework docs.</p></a>`).join("")}</div></section></article>`;
    }
    function home() {
      const d = body.home;
      return `<article><h1>${d.title}</h1><p>${d.lead}</p>${badges(d.badges)}<div class="routes"><a class="card" href="?page=overview"><h3>Учебный маршрут</h3><p>Пошаговый путь от общей модели до live-исполнения.</p></a><a class="card" href="?page=architecture"><h3>Reference</h3><p>Карта подсистем и быстрые входы в разделы.</p></a></div>${atlas()}<section id="browse"><h2>Фильтры по разделам</h2><div class="filters"><button class="active" data-filter="all">Все</button><button data-filter="Guides">Architecture</button><button data-filter="Reference">Research</button><button data-filter="Operations">Execution</button><button data-filter="Operations">Operations</button></div><div class="grid" id="homeCards">${pages.slice(1).map(([s,l,g])=>`<a class="card" data-area="${g}" href="?page=${s}"><h3>${l}</h3><p>Курируемая страница портала.</p></a>`).join("")}</div></section></article>`;
    }
    function render() {
      document.getElementById("nav").innerHTML = navHtml();
      document.getElementById("drawerNav").innerHTML = navHtml();
      const d = body[page] || body.home;
      document.getElementById("content").innerHTML = page === "home" ? home() : commonPage(d);
      const tocItems = page === "home" ? [["#map","Карта фреймворка"],["#browse","Быстрый reference"]] : [["#tab-panel","Панели"],["#flow","Поток"],["#details","Детали"],["#command","Команда"],["#next","Дальше читать"]];
      document.getElementById("toc").innerHTML = `<h3>На этой странице</h3>${tocItems.map(([href,label])=>`<a href="${href}">${label}</a>`).join("")}`;
      document.querySelectorAll(".acc button").forEach(btn => btn.onclick = () => { const acc = btn.parentElement; acc.classList.toggle("open"); btn.setAttribute("aria-expanded", acc.classList.contains("open")); });
      document.querySelectorAll(".tabs button").forEach(btn => btn.onclick = () => { btn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); document.getElementById("tab-panel").textContent = d.panels[btn.dataset.tab]; });
      document.querySelectorAll(".copy").forEach(btn => btn.onclick = async () => { const value = btn.dataset.copy || ""; try { await navigator.clipboard.writeText(value); } catch (_) {} btn.textContent = "Скопировано"; setTimeout(()=>btn.textContent="Скопировать", 1200); });
      document.querySelectorAll(".filters button").forEach(btn => btn.onclick = () => { document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); const f = btn.dataset.filter; document.querySelectorAll("#homeCards .card").forEach(card => card.style.display = f === "all" || card.dataset.area === f ? "" : "none"); });
    }
    function openPalette(q) {
      lastPaletteTrigger = document.activeElement;
      document.getElementById("paletteBackdrop").classList.add("open");
      document.getElementById("paletteSearch").value = q || "";
      drawResults(q || "");
      setTimeout(()=>document.getElementById("paletteSearch").focus(), 0);
    }
    function drawResults(q) {
      activeResult = 0;
      const needle = q.toLowerCase();
      const preferredSlug = expectedPrimary[needle];
      const matches = q && q !== "unknown"
        ? searchDocs
            .filter(item => item.text.toLowerCase().includes(needle))
            .sort((a,b) => {
              const score = item => (preferredSlug && item.slug === preferredSlug ? 100 : 0) + (item.title.toLowerCase() === needle ? 20 : 0) + (item.section.toLowerCase().includes(needle) ? 10 : 0) - (item.slug === "home" ? 30 : 0);
              return score(b) - score(a);
            })
            .slice(0, 8)
        : [];
      document.getElementById("results").innerHTML = q === "unknown" || (q && !matches.length)
        ? `<div class="empty"><h2>Ничего не найдено</h2><p>Попробуй изменить запрос или открыть карту разделов.</p><a class="card" href="?page=architecture">Смотреть карту фреймворка</a></div>`
        : (matches.length ? matches : searchDocs.slice(0,6)).map((item,i)=>`<a class="result ${i===0?'active':''}" href="?page=${item.slug}"><strong>${item.title}</strong><p>${item.area} / ${item.section}: ${item.snippet}</p></a>`).join("");
    }
    function closePalette() {
      document.getElementById("paletteBackdrop").classList.remove("open");
      if (lastPaletteTrigger && lastPaletteTrigger.focus) lastPaletteTrigger.focus();
    }
    function moveResult(delta) {
      const results = [...document.querySelectorAll(".result")];
      if (!results.length) return;
      results[activeResult]?.classList.remove("active");
      activeResult = (activeResult + delta + results.length) % results.length;
      results[activeResult].classList.add("active");
      results[activeResult].focus();
    }
    document.getElementById("topSearch").addEventListener("focus", e => openPalette(e.target.value));
    document.getElementById("paletteSearch").addEventListener("input", e => drawResults(e.target.value));
    document.getElementById("paletteSearch").addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { e.preventDefault(); moveResult(1); }
      if (e.key === "ArrowUp") { e.preventDefault(); moveResult(-1); }
      if (e.key === "Enter") { const target = document.querySelector(".result.active"); if (target) location.href = target.href; }
    });
    document.getElementById("paletteBackdrop").addEventListener("click", e => { if (e.target.id === "paletteBackdrop") closePalette(); });
    document.addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(""); }
      if (e.key === "Escape") { closePalette(); document.getElementById("drawerBackdrop").classList.remove("open"); }
    });
    document.getElementById("themeToggle").onclick = () => { theme = document.body.dataset.theme === "dark" ? "light" : "dark"; document.body.dataset.theme = theme; };
    document.getElementById("openNav").onclick = () => document.getElementById("drawerBackdrop").classList.add("open");
    document.getElementById("closeNav").onclick = () => document.getElementById("drawerBackdrop").classList.remove("open");
    if (params.get("palette")) openPalette(params.get("q") || "");
    if (params.get("nav")) document.getElementById("drawerBackdrop").classList.add("open");
    render();
  </script>
</body>
</html>
