[project]
name = "crypt"
version = "0.0.0"
description = "Ensemble decision system for OKX perpetual futures"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "n-tretyakov" }]

# Runtime dependencies. Concrete versions are resolved and locked by `uv lock`.
# Minimums are set to the latest majors known to work as of project start.
dependencies = [
    "aiohttp>=3.13",
    "ccxt>=4.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "requests>=2.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "apscheduler>=3.10",
    "aiogram>=3.10",
    "loguru>=0.7",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pandas-ta>=0.3.14b",
    "optuna>=4.0",
    "click>=8.1",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
]

[project.scripts]
backtester = "backtester.__main__:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypt", "src/backtester"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",          # pycodestyle / pyflakes
    "I",                    # isort
    "UP",                   # pyupgrade
    "B",                    # bugbear
    "SIM",                  # simplify
    "RET", "ARG", "PTH",
    "TID",
    "C4",
    "PIE",
    "RUF",
]
ignore = [
    "E501",  # handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["crypt", "backtester"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "ccxt.*",
    "pandas.*",
    "pandas_ta.*",
    "pyarrow.*",
    "sklearn.*",
    "apscheduler.*",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
# Prepend src/ so our `crypt` package is found before the deprecated stdlib
# `crypt` module (Python 3.12). Without this, `import crypt.models` resolves
# to the stdlib file and raises ModuleNotFoundError. See ADR-0013.
pythonpath = ["src"]
